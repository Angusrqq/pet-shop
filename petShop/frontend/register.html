{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
    <div class="container reg">
        <h2>Регистрация</h2>
        <form method="POST" action="" class="form">
            {% csrf_token %}
            {% for field in form %}

            {% endfor %}

            <button type="submit" name="Create User">Зарегистрироваться</button>
        </form>
        <a href="{% url 'core:auth' %}">Уже есть аккаунт?</a>
    </div>
{% endblock %}
