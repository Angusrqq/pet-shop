{% extends "base.html" %}

{% block title %}Каталог{% endblock %}

{% block content %}
    <div class="container">
        <h1>{{ product.name }}</h1>
    
        <div>
            <img src="{{ product.image.url }}" alt="{{ product.name }}" width="200">
        </div>
        <h2>{{ product.name }}</h2>
        <p>{{ product.description }}</p>
        <p>{{ product.price }} руб.</p>
    </div>
{% endblock %}
