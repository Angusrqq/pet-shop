{% extends "base.html" %}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="container">
    <div class="auth-box">
        <h2>Смена пароля</h2>
        <form class="form" method="post">
            {% csrf_token %}
            <div class="field">
                <label>Текущий пароль</label>
                {{ form.old_password }}
            </div>
            <div class="field">
                <label>Новый пароль</label>
                {{ form.new_password1 }}
            </div>
            <div class="field">
                <label>Повторите новый пароль</label>
                {{ form.new_password2 }}
            </div>
            <button type="submit">Сохранить</button>
            <a href="{% url 'users:account' %}" class="back-link">← Назад</a>
        </form>
    </div>
</div>
{% endblock %}
