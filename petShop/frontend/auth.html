{% extends "base.html" %}

{% block title %}Авторизация{% endblock %}

{% block content %}
    <div class="container auth">
        <h1>Авторизация</h1>
        <form method="POST" action="" class="form">
            {% csrf_token %}
            {% for field in form %}
                {{ field }}
            {% endfor %}

            <button type="submit" name="Log in">Войти</button>
        </form>
        <a href="{% url 'users:register' %}">Нет аккаунта?</a>
    </div>
{% endblock %}
