name: PetShop

services:
  postgres:
    image: postgres:17.4-alpine3.21
    container_name: database
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
  
  django:
    build: .
    container_name: django_app
    restart: always
    env_file:
      - .env
    depends_on:
      - postgres
    volumes:
      - ./petShop:/app
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python manage.py migrate && python manage.py runserver 0.0.0.0:8000
      "